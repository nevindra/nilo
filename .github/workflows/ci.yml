# The other half of splitting `zig build test`.
#
# `test` runs in Debug and takes 0.8s, which is the point of it. `test-all`
# runs the same suite again in ReleaseSafe, because a lifetime bug passes in
# Debug and segfaults in the mode people deploy in (ADR 018). That check used
# to happen on every local test run and now happens here, so being fast locally
# does not mean shipping without it.
#
# Zig is downloaded and checksummed rather than installed by a third-party
# action: one fewer thing to trust, and the version is pinned to the same
# `minimum_zig_version` that build.zig.zon names.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A real Postgres and a real object store, so the live halves of
    # `nilo_sql`, `nilo_job` and `nilo_s3` run here rather than skip. They
    # skip on a machine with neither set, which is right for the local loop
    # and was, until these were added, also what happened here.
    #
    # Plain `postgres:18` rather than the Timescale image
    # `sql/docker-compose.yml` uses: nothing in `sql/` needs an extension,
    # and it is a tenth of the pull.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nilo
          POSTGRES_PASSWORD: nilo
          POSTGRES_DB: nilo
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U nilo -d nilo"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      DATABASE_URL: postgres://nilo:nilo@localhost:5433/nilo
      S3_ENDPOINT: http://127.0.0.1:9100
      S3_ACCESS_KEY: niloadmin
      S3_SECRET_KEY: nilosecret123

    steps:
      - uses: actions/checkout@v4

      # SeaweedFS rather than MinIO, because MinIO stopped publishing images
      # and the pinned one now answers "unauthorized". Not a service
      # container, because it needs `server -s3` as its command and a service
      # cannot be given one. The credentials come from the environment, and a
      # wrong secret is refused, so the live tests still check a signature.
      # The bucket is made by the same script the benchmark uses.
      - name: Start SeaweedFS
        run: |
          set -euo pipefail
          docker run -d --name seaweedfs -p 9100:8333 \
            -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
            chrislusf/seaweedfs:4.47 server -dir=/data -s3 -s3.port=8333
          for _ in $(seq 60); do
            curl -fs -o /dev/null "$S3_ENDPOINT/healthz" && break
            sleep 1
          done
          python3 bench/s3_setup.py

      - name: Cache Zig's global cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-${{ env.ZIG_VERSION }}-

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL --retry 3 -o zig.tar.xz "$url"
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig"
          tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - run: zig version

      # Both modes. This is the job that exists.
      - name: zig build test-all
        run: zig build test-all

      # An example that stops compiling is a failed build rather than a
      # surprise for the first person who copies it.
      - name: zig build examples
        run: zig build examples

      # `test-all` already runs the parser's properties over the corpus,
      # which is every input this has ever caught. This runs them over a
      # million generated ones: the corpus is the regression half, and this
      # is the half that finds something new. About eight seconds.
      #
      # The seed is the commit, so a given commit always fuzzes the same
      # million inputs — re-running a red job gives the same answer instead
      # of a coin toss — while a new commit explores a different million.
      # A failure prints the seed and the bytes, ready to be pasted into
      # the corpus in `src/fuzz.zig`.
      - name: zig build fuzz
        run: zig build fuzz -- --iterations 1000000 --seed 0x$(echo "${{ github.sha }}" | cut -c1-16)

  # Apple silicon, for what a Linux runner cannot show: 16 KiB pages rather
  # than 4, zio on kqueue rather than io_uring and epoll, and the branches
  # under `builtin.os.tag` that name Darwin or fall to "anything not Linux".
  # The first of those hid a test that asserted nothing until somebody ran
  # the suite on a Mac (docs/history.md, "Tests that could not fail").
  #
  # `test` rather than `test-all`: this job is for what differs by platform,
  # and ReleaseSafe does not; that is covered above. No Postgres or object store for
  # the same reason, so those tests skip here.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      ZIG_SHA256_MACOS: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
    steps:
      - uses: actions/checkout@v4

      - name: Cache Zig's global cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-macos-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-macos-${{ env.ZIG_VERSION }}-

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          curl -fsSL --retry 3 -o zig.tar.xz "$url"
          echo "${ZIG_SHA256_MACOS}  zig.tar.xz" | shasum -a 256 -c -
          mkdir -p "$HOME/zig"
          tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - run: zig version

      - name: fetch tests with timing
        run: zig build test-fetch 2>&1 | grep -E "DIAG|failed|error" | head -120 || true

  # The guide is published only when a tag is pushed (docs.yml), so a page
  # link or a heading anchor broken on main would otherwise be found by the
  # release. mkdocs.yml builds strict: any broken one fails this job.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/site/requirements.txt

      - run: pip install -r docs/site/requirements.txt

      - name: mkdocs build
        run: mkdocs build
