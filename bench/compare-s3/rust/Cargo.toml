[package]
name = "s3rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls", "sigv4a"] }
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-credential-types = "1"
aws-smithy-types = "1"
http = "1"

# The same profile rustaxum/ uses, so the two Rust rows in the two comparisons
# are built the same way and a difference between them is about the code.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
